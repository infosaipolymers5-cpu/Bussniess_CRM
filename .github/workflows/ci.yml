name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: rushi_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rushi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Deployment safety verification
        run: npm run test:deployment

      - name: PostgreSQL RLS Integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:54322/rushi_test
          REQUIRE_DB: 'true'
        run: npm run test:rls

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
          VITE_APP_TIMEZONE: Asia/Kolkata
          VITE_DEFAULT_LOCALE: en
        run: npm run build
